<script>
const scenes=[{"title": "首页", "ref": "../../交互验收标准/原图裁切/01_画境自然苏醒.png", "before": "../ui-acceptance-2026-10-25/01-hero.png", "after": "hero-light.png", "ratio": 1.6, "note": "导航纸底与墨色修复；山水、中央题字和小舟保留。"}, {"title": "日历", "ref": "../../交互验收标准/原图裁切/02_纸张有生命.png", "before": "../ui-acceptance-2026-10-25/02-calendar.png", "after": "1440-calendar-light.png", "ratio": 1.6, "note": "约1:1纸册、居中日签、朱砂圆印；跨月农历恢复可读。"}, {"title": "史事", "ref": "../../交互验收标准/原图裁切/03_由字入画.png", "before": "../ui-acceptance-2026-10-25/03-reader.png", "after": "reader-desktop.png", "ratio": 1.6, "note": "画作约69%、题跋约31%；正文、出处、返回与前后事保留。"}, {"title": "长卷", "ref": "../../交互验收标准/原图裁切/04_横向展卷.png", "before": "../ui-acceptance-2026-10-25/04-scroll.png", "after": "1440-scroll-light.png", "ratio": 1.6, "note": "保留十四时期山水长卷、卷杆和轻量时间轴；文字统一可读字阶。"}, {"title": "四时", "ref": "../../交互验收标准/原图裁切/05_节气物象.png", "before": "../ui-acceptance-2026-10-25/05-seasons.png", "after": "1440-seasons-light.png", "ratio": 1.6, "note": "窗外枝叶独立于圆窗，桌面约八个小景宽度，全部24节气仍可访问。"}, {"title": "回望", "ref": "../../交互验收标准/原图裁切/06_时间快速回溯.png", "before": "../ui-acceptance-2026-10-25/06-lookback.png", "after": "lookback-500-static.png", "ratio": 1.6, "note": "修复后为真实动画580ms暂停帧：1526·明，500年档明确高亮。修复前是较早的动画帧，数字不用于同帧对比。"}, {"title": "搜索", "ref": "../../交互验收标准/原图裁切/07_多维度检索.png", "before": "../ui-acceptance-2026-10-25/07-search.png", "after": "search-stable.png", "ratio": 1.6, "note": "从右上展开的纸质检索面；缩略图、来源分组与纪年保留。"}, {"title": "空白日", "ref": "../../交互验收标准/原图裁切/08_留白仍可探索.png", "before": "../ui-acceptance-2026-10-25/08-blank.png", "after": "blank-stable.png", "ratio": 1.6, "note": "真实日期与农历、淡山水和两个有史日入口；不制造空日期的史事。"}, {"title": "手机", "ref": "../../交互验收标准/原图裁切/09_单手也能翻.png", "before": "../ui-acceptance-2026-10-25/09-mobile-calendar.png", "after": "390-calendar-light.png", "ratio": 0.46208530805687204, "note": "44px通用触区、16px摘要和12px出处。完整月历和史事正文同时保留。"}, {"title": "视觉语言", "ref": "../../交互验收标准/原图裁切/10_中式设计语言.png", "before": "../ui-acceptance-2026-10-25/17-dark-calendar.png", "after": "1440-calendar-dark.png", "ratio": 1.6, "note": "深色纸面、朱砂印记、次墨层级；对照原规范中的青绿、宋体与纸纹。"}];

const $=s=>document.querySelector(s),range=$('#split');
function split(value){range.value=value;$('#compare').style.setProperty('--split',value+'%');$('#position').textContent=`前 ${value}% / 后 ${100-value}%`;}
function choose(index){const s=scenes[index];$('#sceneTitle').textContent=String(index+1).padStart(2,'0')+' · '+s.title;$('#sceneNote').textContent=s.note;$('#before').src=s.before;$('#after').src=s.after;$('#reference').src=s.ref;$('#original').href=s.after;$('#compare').style.setProperty('--ratio',s.ratio);document.querySelectorAll('[data-scene]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));split(50);}
scenes.forEach((s,i)=>{const button=document.createElement('button');button.type='button';button.dataset.scene=i;button.textContent=s.title;button.onclick=()=>choose(i);$('#scenes').append(button);});
range.oninput=()=>split(Number(range.value));$('#onlyAfter').onclick=()=>split(0);$('#half').onclick=()=>split(50);choose(0);
</script></main></html>
